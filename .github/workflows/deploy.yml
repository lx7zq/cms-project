name: CI

# ไม่มี VPS แล้ว — ไฟล์นี้ตรวจ code เฉยๆ (test + build)
# deploy จริง: backend → Railway, frontend → GitHub Pages (deploy-frontend-pages.yml)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Bun + Prisma ──
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ต้อง generate ก่อน test: test mock lib/prisma แต่ bun ยังต้อง resolve
      # generated/prisma/client ได้ (โฟลเดอร์นี้โดน gitignore ใน CI เลยไม่มี)
      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Run tests
        run: bun test

  # ── Frontend: Vue + Vite ──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          # มี secrets ก็ใช้ ไม่มีก็ build ด้วยค่า fallback (/api) — แค่ตรวจว่า code ไม่พัง
          VITE_APP_API_URL: ${{ secrets.API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
